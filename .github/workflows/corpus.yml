name: Corpus

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone corpus
        id: corpus
        background: true
        run: |-
          git clone --depth 1 https://github.com/marcoroth/herb-corpus corpus

      - name: Add LLVM apt Repo
        run: |-
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt update

      - name: Install APT dependencies
        run: xargs sudo apt-get install -y --no-install-recommends < Aptfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install the last released gem
        id: release
        run: |-
          version=$(gem search '^herb$' --remote --no-prerelease | sed -n 's/^herb (\([0-9][0-9.]*\).*/\1/p')

          if [ -z "$version" ]; then
            echo "Could not resolve the latest released herb version" >&2
            exit 1
          fi

          gem install herb -v "$version" --no-document

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Comparing against herb $version"

      - name: Wait for the corpus clone
        wait: [corpus]

      - name: Measure the last release
        id: measure-release
        background: true
        env:
          BUNDLE_GEMFILE: ""
          RUBYOPT: ""
        run: |-
          corpus/bin/measure-herb \
            --version "${{ steps.release.outputs.version }}" \
            --label "released ${{ steps.release.outputs.version }}" \
            --corpus corpus/erb \
            --out corpus/runs/release.json

      - name: Render Templates
        run: bundle exec rake templates

      - name: Compile Herb
        run: bundle exec rake make

      - name: Compile Ruby extension
        run: bundle exec rake compile

      - name: Wait for the release measurement
        wait-all:

      - name: Measure this branch
        env:
          BUNDLE_GEMFILE: ""
          RUBYOPT: ""
        run: |-
          corpus/bin/measure-herb \
            --gem-path "$GITHUB_WORKSPACE" \
            --label "this branch (${GITHUB_SHA::7})" \
            --corpus corpus/erb \
            --out corpus/runs/branch.json

      - name: Compare
        id: compare
        env:
          NO_COLOR: "1"
        run: |-
          set -o pipefail

          corpus/bin/diff-runs \
            corpus/runs/release.json \
            corpus/runs/branch.json \
            --markdown comment.md \
            --fail-on-regression | tee comparison.txt

      - name: Comment on the pull request
        if: failure() && github.event_name == 'pull_request' && hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |-
          existing=$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments" \
            --jq 'map(select(.body | contains("<!-- corpus-report -->"))) | .[0].id // empty')

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@comment.md >/dev/null
            echo "Updated comment $existing."
          else
            gh pr comment "$NUMBER" --body-file comment.md
            echo "Posted a new comment."
          fi

      - name: Job summary
        if: always()
        run: |-
          {
            echo "### Corpus: this branch vs herb ${{ steps.release.outputs.version }}"
            echo
            echo '```'
            cat comparison.txt 2>/dev/null || echo "the comparison did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-runs
          path: corpus/runs/*.json
          retention-days: 30

  linter-parity:
    name: Linter Parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - parallel:
        - name: Clone corpus
          run: |-
            git clone --depth 1 https://github.com/marcoroth/herb-corpus corpus

        - name: Add LLVM apt Repo
          run: |-
            wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
            sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
            sudo apt update
            xargs sudo apt-get install -y --no-install-recommends < Aptfile

        - name: Set up Ruby
          uses: ruby/setup-ruby@v1
          with:
            bundler-cache: true

        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: yarn

        - name: Set up Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: wasm32-unknown-emscripten

        - name: Set up Emscripten
          uses: mymindstorm/setup-emsdk@v14


      - name: Render Templates
        run: bundle exec rake templates

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build the Rust linter for WASM
        run: cargo build -p herb-linter --release --target wasm32-unknown-emscripten
        working-directory: rust

      - name: Build the linter
        run: yarn nx build @herb-tools/linter

      - name: Compare the backends on the default rule set
        env:
          NO_COLOR: "1"
        run: |-
          set +e

          javascript/packages/linter/bin/herb-lint corpus/erb \
            --fail-on-backend-mismatch \
            --no-timing \
            --format simple 2>&1 | tee parity-defaults.txt

          status=${PIPESTATUS[0]}

          if [ "$status" -eq 2 ]; then
            echo "::error::The backends disagree on the default rule set"
            exit 1
          fi

      - name: Compare the backends with every rule enabled
        env:
          NO_COLOR: "1"
        run: |-
          set +e

          javascript/packages/linter/bin/herb-lint corpus/erb \
            --all-rules \
            --fail-on-backend-mismatch \
            --no-timing \
            --format simple 2>&1 | tee parity-all-rules.txt

          status=${PIPESTATUS[0]}

          if [ "$status" -eq 2 ]; then
            echo "::error::The backends disagree with every rule enabled"
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |-
          {
            echo "### Linter backend parity"
            echo
            for run in defaults all-rules; do
              echo "#### $run"
              echo '```'
              tail -n 30 "parity-$run.txt" 2>/dev/null || echo "the $run comparison did not run"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
