name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools with mise
        uses: jdx/mise-action@v4
        env:
          MISE_DISABLE_TOOLS: ruby,node

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: bundle install
        run: bundle install

      - name: Install libc debug symbols for valgrind
        run: sudo apt-get install -y --no-install-recommends libc6-dbg

      - name: Render Templates
        run: bundle exec rake templates

      - name: RuboCop
        run: bundle exec rubocop

      - name: Yerba
        run: bundle exec yerba check

      - name: clang-format version
        run: clang-format --version | grep "version 21"

      - name: Lint
        run: bin/lint

      - name: RBS Validation
        run: |-
          bundle exec rbs collection install --frozen
          bundle exec rbs -Isig validate

      - name: Steep
        run: bundle exec steep check

      - name: Sorbet
        run: bundle exec srb tc

      - name: RBS Inline
        run: bundle exec rake rbs_inline

      - name: clang-tidy version
        run: clang-tidy --version | grep "version 21"

      - name: Tidy
        run: bin/tidy

      - name: Compile Herb
        run: bundle exec rake make

      - name: Compile Ruby extension
        run: bundle exec rake compile

      - name: Run Ruby Tests
        run: bundle exec rake test:all

      - name: Run C tests
        run: ./run_herb_tests

      - name: Run allocation benchmark
        run: make bench_allocs

      - name: Run valgrind on examples/
        run: ./bin/valgrind_check_examples

      - name: Run valgrind on examples/ with the tracking allocator
        run: ./bin/valgrind_check_allocations
