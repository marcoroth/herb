# frozen_string_literal: true
# Config used by the bench/linter run. Enables only the linters that have a
# 1:1 equivalent in @herb-tools/linter so we're comparing like-for-like work.
# The full rule map lives in bench/linter/run.rb (RULE_MAP).

EnableDefaultLinters: false

# Match the corpus layout (flat .erb / .rhtml / .herb files under one root).
glob: "**/*.{erb,rhtml,herb}"

linters:
  AllowedScriptType:
    enabled: true
  CommentSyntax:
    enabled: true
  ExtraNewline:
    enabled: true
  FinalNewline:
    enabled: true
  NoJavascriptTagHelper:
    enabled: true
  ParserErrors:
    enabled: true
  RequireInputAutocomplete:
    enabled: true
  RequireScriptNonce:
    enabled: true
  RightTrim:
    enabled: true
  SelfClosingTag:
    enabled: true
  TrailingWhitespace:
    enabled: true
