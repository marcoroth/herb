[package]
name = "herb-highlighter"
version = "0.10.3"
edition = "2021"
authors = ["Marco Roth <marco.roth@intergga.ch>"]
description = "Syntax highlighter and diagnostic renderer for HTML+ERB templates"
license = "MIT"
repository = "https://github.com/marcoroth/herb"
include = ["src/**/*", "themes/*.json", "Cargo.toml", "README.md"]

[lib]
name = "herb_highlighter"
path = "src/lib.rs"

[[bin]]
name = "herb-highlight"
path = "src/bin/herb_highlight.rs"
required-features = ["cli"]

[[example]]
name = "diff_view"
test = true

[[example]]
name = "diff_styles"

[features]
default = []
cli = []

[dependencies]
herb = { path = "..", version = "0.10.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1.40"
tempfile = "3"
