[package]
name = "herb-analysis"
version = "0.10.3"
edition = "2021"
authors = ["Marco Roth <marco.roth@intergga.ch>"]
description = "Cross-file static analysis of Ruby and Action View sources for Herb"
license = "MIT"
repository = "https://github.com/marcoroth/herb"
publish = false

[lib]
name = "herb_analysis"
path = "src/lib.rs"

[[bin]]
name = "herb-analysis"
path = "src/bin/herb_analysis.rs"

[dependencies]
colored = "3"
herb = { path = ".." }
rubydex = "=0.2.5"

[dev-dependencies]
insta = "1.40"
