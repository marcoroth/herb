[package]
name = "herb-shape"
version = "0.8.10"
edition = "2021"
authors = ["Marco Roth <marco.roth@intergga.ch>"]
description = "Structural type system for Herb (HTML+ERB) templates"
license = "MIT"
repository = "https://github.com/marcoroth/herb"

[lib]
name = "herb_shape"
path = "src/lib.rs"

[[bin]]
name = "herb-shape"
path = "src/main.rs"

[dependencies]
herb = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1.40"
