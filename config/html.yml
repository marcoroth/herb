    - sup
    - svg
    - table
    - tbody
    - td
    - template
    - textarea
    - tfoot
    - th
    - thead
    - time
    - title
    - tr
    - track
    - tt
    - u
    - ul
    - var
    - video
    - wbr

svg:
  # SVG elements whose specified name is camelCase rather than lowercase.
  camel_case:
    - animateMotion
    - animateTransform
    - clipPath
    - feBlend
    - feColorMatrix
    - feComponentTransfer
    - feComposite
    - feConvolveMatrix
    - feDiffuseLighting
    - feDisplacementMap
    - feDistantLight
    - feDropShadow
    - feFlood
    - feFuncA
    - feFuncB
    - feFuncG
    - feFuncR
    - feGaussianBlur
    - feImage
    - feMerge
    - feMergeNode
    - feMorphology
    - feOffset
    - fePointLight
    - feSpecularLighting
    - feSpotLight
    - feTile
    - feTurbulence
    - foreignObject
    - glyphRef
    - linearGradient
    - radialGradient
    - textPath

  # The remaining SVG elements, which are lowercase already. The full set of
  # known SVG elements is this list plus the lowercased `camel_case` names.
  known:
    - a
    - animate
    - circle
    - defs
    - desc
    - ellipse
    - filter
    - g
    - image
    - line
    - marker
    - mask
    - metadata
    - path
    - pattern
    - polygon
    - polyline
    - rect
    - set
    - stop
    - style
    - switch
    - symbol
    - text
    - title
    - tspan
    - use

mathml:
  known:
    - annotation
    - annotation-xml
    - maction
    - math
    - menclose
    - merror
    - mfenced
    - mfrac
    - mglyph
    - mi
    - mlabeledtr
    - mmultiscripts
    - mn
    - mo
    - mover
    - mpadded
    - mphantom
    - mprescripts
    - mroot
    - mrow
    - ms
    - mspace
    - msqrt
    - mstyle
    - msub
    - msubsup
    - msup
    - mtable
    - mtd
    - mtext
    - mtr
    - munder
    - munderover
    - none
    - semantics

attributes:
  # Attributes that carry a space-separated list of tokens.
  token_list:
    - class
    - data-action
    - data-controller

  # Attributes that are meaningless when empty.
  restricted_when_empty:
    - class
    - data
    - for
    - href
    - id
    - name
    - role
    - src
    - title

  # Attributes whose presence alone is meaningful, so they take no value.
  boolean:
    - allowfullscreen
    - async
    - autofocus
    - autoplay
    - checked
    - compact
    - controls
    - declare
    - default
    - defer
    - disabled
    - formnovalidate
    - hidden
    - inert
    - ismap
    - itemscope
    - loop
    - multiple
    - muted
    - nohref
    - nomodule
    - noresize
    - noshade
    - novalidate
    - nowrap
    - open
    - playsinline
    - readonly
    - required
    - reversed
    - scoped
    - seamless
    - selected
    - sortable
    - truespeed
    - typemustmatch

script:
  # Values accepted by the `type` attribute of a `<script>` element.
  allowed_types:
    - text/javascript
    - module
    - importmap
    - speculationrules
    - application/ld+json
