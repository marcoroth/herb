# https://www.w3.org/TR/wai-aria-1.2/#role_definitions
roles:
  # Roles that may be used as a `role` attribute value.
  valid:
    - alert
    - alertdialog
    - article
    - banner
    - button
    - cell
    - checkbox
    - columnheader
    - combobox
    - complementary
    - contentinfo
    - definition
    - dialog
    - directory
    - document
    - feed
    - figure
    - form
    - graphics-document
    - graphics-object
    - graphics-symbol
    - grid
    - gridcell
    - group
    - heading
    - img
    - link
    - list
    - listbox
    - listitem
    - log
    - main
    - marquee
    - math
    - menu
    - menubar
    - menuitem
    - menuitemcheckbox
    - menuitemradio
    - navigation
    - none
    - note
    - option
    - presentation
    - progressbar
    - radio
    - radiogroup
    - region
    - row
    - rowgroup
    - rowheader
    - scrollbar
    - search
    - searchbox
    - separator
    - slider
    - spinbutton
    - status
    - switch
    - tab
    - table
    - tablist
    - tabpanel
    - term
    - textbox
    - timer
    - toolbar
    - tooltip
    - tree
    - treegrid
    - treeitem

  # Roles whose accessible name must come from their content.
  cannot_be_named:
    - caption
    - code
    - definition
    - deletion
    - emphasis
    - generic
    - insertion
    - mark
    - none
    - paragraph
    - presentation
    - strong
    - subscript
    - suggestion
    - superscript
    - term
    - time
    - tooltip

  # Abstract roles exist to organise the taxonomy and must not be used directly.
  abstract:
    - command
    - composite
    - input
    - landmark
    - range
    - roletype
    - section
    - sectionhead
    - select
    - structure
    - widget
    - window

# `aria-*` attributes defined by WAI-ARIA.
attributes:
  - aria-activedescendant
  - aria-atomic
  - aria-autocomplete
  - aria-busy
  - aria-checked
  - aria-colcount
  - aria-colindex
  - aria-colspan
  - aria-controls
  - aria-current
  - aria-describedby
  - aria-details
  - aria-disabled
  - aria-dropeffect
  - aria-errormessage
  - aria-expanded
  - aria-flowto
  - aria-grabbed
  - aria-haspopup
  - aria-hidden
  - aria-invalid
  - aria-keyshortcuts
  - aria-label
  - aria-labelledby
  - aria-level
  - aria-live
  - aria-modal
  - aria-multiline
  - aria-multiselectable
  - aria-orientation
  - aria-owns
  - aria-placeholder
  - aria-posinset
  - aria-pressed
  - aria-readonly
  - aria-relevant
  - aria-required
  - aria-roledescription
  - aria-rowcount
  - aria-rowindex
  - aria-rowspan
  - aria-selected
  - aria-setsize
  - aria-sort
  - aria-valuemax
  - aria-valuemin
  - aria-valuenow
  - aria-valuetext

# Attributes that provide an element's accessible name.
label_attributes:
  - aria-label
  - aria-labelledby
