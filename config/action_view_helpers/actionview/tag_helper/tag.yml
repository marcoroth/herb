---
name: "tag"
source: "ActionView::Helpers::TagHelper#tag"
gem: "actionview"
output: "html"
visibility: "public"
supported: true
supports_block: true
signature: "tag.<tag_name>(content = nil, **options, &block)"
documentation_url: "https://api.rubyonrails.org/classes/ActionView/Helpers/TagHelper.html#method-i-tag"
attributes_arg: "keywords"
transform_style: "generic"

content:
  source: "block_or_arg"
  arg_position: 1
  skip_if_hash: true

description: |-
  Returns an HTML5 compliant tag with a tag proxy. Every tag can be built with `tag.<tag name>(optional content, options)`. Supports `data-*` and `aria-*` attributes via nested hashes. Sub-attributes are dasherized. Respects HTML5 void elements.

tag:
  name: null
  is_void: false
  preferred: false
  detect_style: "receiver_call"

arguments:
  - name: "content"
    position: 1
    type: "string"
    optional: true
    default: "nil"
    description: |-
      Tag content string.

options:
  - name: "class"
    type: "string"
    description: |-
      CSS class name(s).

  - name: "id"
    type: "string"
    description: |-
      HTML id attribute.

  - name: "data"
    type: "hash"
    maps_to: "data-*"
    description: |-
      Hash of `data-*` attributes.

  - name: "aria"
    type: "hash"
    maps_to: "aria-*"
    description: |-
      Hash of `aria-*` attributes.

block_arguments:
  - name: "tag"
    position: 1
    type: "ActionView::Helpers::TagHelper::TagBuilder"
    optional: false
    description: |-
      The tag builder, for nesting further tags inside the element.

special_behaviors:
  - type: "method_name_underscores_to_dashes"
